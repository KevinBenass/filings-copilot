[project]
name = "filings-copilot"
version = "0.1.0"
description = "Production-style RAG over SEC 10-K filings: hybrid search, reranking, contextual chunks, cited answers and a rigorous evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Benassuly" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "tabulate>=0.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Heavy model dependencies (torch). Kept optional so CI and the API image stay light.
ml = ["sentence-transformers>=3.0"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "streamlit>=1.35"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "httpx>=0.27"]

[project.scripts]
fcopilot = "filings_copilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
