[project]
name = "filings-copilot"
version = "0.1.0"
description = "Production-style RAG over SEC 10-K filings: hybrid search, reranking, contextual chunks, cited answers and a rigorous evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Benassuly" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    # Intel Macs: PyTorch's last x86_64 macOS build (2.2.x) was compiled against NumPy 1.x.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "tabulate>=0.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Heavy model dependencies (torch). Kept optional so CI and the API image stay light.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    # PyTorch stopped publishing Intel-Mac wheels after 2.2.2, and transformers 5 needs
    # torch>=2.6, so Intel Macs get the last compatible line of each.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.41,<4.58; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "streamlit>=1.35"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "httpx>=0.27"]

[project.scripts]
fcopilot = "filings_copilot.cli:app"

[tool.uv]
# Make the lockfile resolve for Intel Macs too, not only for the platforms the newest wheels cover.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
