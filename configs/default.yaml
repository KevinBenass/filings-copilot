# Default configuration. Every experiment in results/ is reproducible from this file
# plus the overrides declared in configs/ablations.yaml.

corpus:
  # 8 companies x 3 fiscal years = 24 annual reports (~2M tokens of text).
  tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, JPM, JNJ, XOM]
  # SEC Central Index Keys never change, unlike ticker lookups. Tickers missing here are
  # resolved through the SEC ticker list.
  ciks: {AAPL: "0000320193", MSFT: "0000789019", NVDA: "0001045810", AMZN: "0001018724",
         GOOGL: "0001652044", JPM: "0000019617", JNJ: "0000200406", XOM: "0000034088"}
  # Display names used in chunk headers, citations and the README (SEC names are often upper case).
  names: {AAPL: "Apple Inc.", MSFT: "Microsoft Corporation", NVDA: "NVIDIA Corporation",
          AMZN: "Amazon.com, Inc.", GOOGL: "Alphabet Inc.", JPM: "JPMorgan Chase & Co.",
          JNJ: "Johnson & Johnson", XOM: "Exxon Mobil Corporation"}
  form: "10-K"
  fiscal_years: [2023, 2024, 2025]
  # SEC asks automated clients to identify themselves. Override with env SEC_USER_AGENT.
  user_agent: "filings-copilot research (set SEC_USER_AGENT)"
  raw_dir: data/raw
  parsed_dir: data/parsed

chunking:
  strategy: structure        # structure | fixed
  max_tokens: 400
  overlap_tokens: 60         # fixed strategy only
  min_tokens: 40             # merge tiny trailing paragraphs into the previous chunk
  context: metadata          # none | metadata | llm
  chunks_dir: data/chunks

embedding:
  model: BAAI/bge-base-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  index_dir: data/index

retrieval:
  mode: hybrid               # bm25 | dense | hybrid
  candidates_per_retriever: 50
  rrf_k: 60
  use_filters: true          # ticker / fiscal-year filters from query understanding
  decompose: false           # LLM query decomposition for multi-hop questions
  rerank: true
  reranker_model: BAAI/bge-reranker-v2-m3
  rerank_top_n: 40
  top_k: 8

llm:
  # Model routing: cheap model for high-volume work, stronger model for answers.
  fast_model: claude-haiku-5-5
  answer_model: claude-sonnet-5-5
  judge_model: claude-haiku-5-5
  max_tokens: 1024
  cache_path: data/llm_cache.sqlite
  # Parallel requests. On a low API tier (tier 1: ~50 requests/min) lower this to 4;
  # rate-limited calls wait and retry either way.
  max_concurrency: 16
  max_retries: 10
  # USD per million tokens. Verify against the current Anthropic pricing page.
  prices:
    claude-haiku-5-5: {input: 1.0, output: 5.0}
    claude-sonnet-5-5: {input: 3.0, output: 15.0}
    claude-opus-5-5: {input: 5.0, output: 25.0}

eval:
  gold_path: data/eval/gold.jsonl
  n_single_hop: 180
  n_table: 60
  n_multi_hop: 40
  n_unanswerable: 30
  seed: 7
  ks: [1, 3, 5, 10]
  results_dir: results
